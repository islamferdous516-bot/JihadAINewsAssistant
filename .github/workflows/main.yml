name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # এই ধাপে আপনার ফোল্ডারে কী কী ফাইল আছে তা দেখা যাবে
      - name: Check Project Files Structure
        run: |
          echo "=== ফাইল লিস্ট ==="
          ls -la
          echo "=== app ফোল্ডার চেক ==="
          ls -la app || echo "ERROR: app ফোল্ডার নেই!"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant Execute Permission
        run: chmod +x gradlew || echo "ERROR: gradlew ফাইল নেই!"

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: App-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
