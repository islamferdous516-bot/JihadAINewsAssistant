workflows:
  android-apk:
    name: Jihad AI News Assistant - Android APK
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      java: 17
    scripts:
      - name: Make Gradle bootstrap executable
        script: chmod +x ./gradlew
      - name: Build debug APK
        script: ./gradlew --no-daemon assembleDebug
    artifacts:
      - app/build/outputs/apk/debug/*.apk
